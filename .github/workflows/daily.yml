name: Daily data update

on:
  schedule:
    # 01:00 UTC = 08:00 ICT (Cambodia time)
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  scrape-and-enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/build_daily.py

      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name "khemera-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily data update $(date -u +'%Y-%m-%d')"
            # Someone may have pushed to main since checkout (e.g. a manual push);
            # retry with a rebase instead of failing the whole run.
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not trigger other workflows'
      # `on: push` events (GitHub's loop-prevention rule) — so pages.yml won't fire
      # on its own. Trigger it explicitly instead.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}"
